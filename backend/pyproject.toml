[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrisense-ai-backend"
version = "0.1.0"
description = "FastAPI backend foundation for AgriSense AI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]